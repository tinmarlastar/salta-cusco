<!DOCTYPE html>
<!-- « Nations » est posé ici, pas seulement par `js/app.js` : sans cet
     attribut, la page se peignait en bleu nuit (le :root) le temps que le
     module démarre, puis virait au papier froid. Un habillage par défaut qui
     n'existe qu'après le premier rendu n'est pas un défaut, c'est un
     clignotement. Une visite qui a choisi autre chose est rétablie ensuite. -->
<html lang="fr" data-habillage="nations">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aventure des 4 Nations — Salta → Cusco à moto</title>
<meta name="description" content="Le parcours jour par jour du raid moto Salta–Cusco : 3 036 km, 875 km de piste, quatre pays andins, du désert d'Atacama au Machu Picchu.">
<!-- La barre du navigateur suit l'habillage par défaut, pas l'habillage
     d'origine : sur mobile, un bandeau bleu nuit au-dessus d'une page claire
     se voyait comme une erreur de chargement. -->
<meta name="theme-color" content="#F4F6F8">

<meta property="og:type" content="website">
<meta property="og:title" content="Aventure des 4 Nations — Salta → Cusco à moto">
<meta property="og:description" content="3 036 km, 875 km de piste, quatre pays andins. Le parcours jour par jour.">
<meta property="og:image" content="img/etapes/hero-piste-andes.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Caveat:wght@400..700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="saut-contenu" href="#panneau">Aller au détail de l'étape</a>

<header class="bandeau">
  <div class="bandeau__identite">
    <p class="eyebrow" id="eyebrow-voyage"></p>
    <h1 class="bandeau__titre" id="titre-voyage"></h1>
  </div>

  <!-- La navigation est à droite du titre : elle commande, elle ne nomme pas.
       Un seul bouton : le retour au parcours entier. Les étapes se choisissent
       sur la frise et au bas du panneau, où elles sont nommées ; le pas-à-pas
       de l'entête refaisait une troisième fois le même geste. Les flèches du
       clavier, elles, continuent d'avancer d'une étape. -->
  <!-- Choix de l'habillage : quatre jeux de couleurs, à comparer sur le site
       plutôt que sur une maquette. -->
  <div class="habillages" role="group" aria-label="Habillage du site">
    <button type="button" data-habillage="" aria-pressed="false" title="Nuit" aria-label="Habillage Nuit"></button>
    <button type="button" data-habillage="sel" aria-pressed="false" title="Sel" aria-label="Habillage Sel"></button>
    <button type="button" data-habillage="altiplano" aria-pressed="false" title="Altiplano" aria-label="Habillage Altiplano"></button>
    <button type="button" data-habillage="nations" aria-pressed="true" title="Nations" aria-label="Habillage Nations"></button>
  </div>

  <div class="bandeau__navigation">
    <button type="button" class="bouton-accueil" id="bouton-accueil" hidden>Tout le parcours</button>
  </div>

</header>

<!-- La frise est la barre de navigation du site : le profil d'altitude, les
     quinze journées et le nombre de souvenirs de chacune, d'un seul tenant.
     Posée au-dessus de la carte, là où on la cherche. -->
<nav class="frise" aria-label="Choisir une journée">
  <div class="frise__defilement">
    <svg class="frise__svg" id="frise" role="img"
         aria-label="Profil d'altitude du voyage entier, du jour 1 au jour 15. Cliquez une étape pour la détailler."></svg>
  </div>
</nav>

<main class="scene">
  <div id="carte" class="carte" role="application" aria-label="Carte du parcours">
    <!-- Le choix du fond commande la carte : il vit donc DANS la carte, et
         reste à portée sur toutes les vues. Placé dans la scène, il se serait
         retrouvé par-dessus le panneau dès que les deux ont échangé de côté ;
         placé dans le panneau, il aurait disparu à l'ouverture d'une étape. -->
    <div class="fonds" role="group" aria-label="Fond de carte">
      <button type="button" class="fonds__bouton" data-fond="satellite" aria-pressed="true">Satellite</button>
      <button type="button" class="fonds__bouton" data-fond="relief" aria-pressed="false">Relief</button>
      <button type="button" class="fonds__bouton" data-fond="plan" aria-pressed="false">Plan</button>
    </div>
  </div>

  <button type="button" class="panneau__poignee" id="poignee" aria-expanded="false" aria-controls="panneau">
    <!-- Un seul chevron, dessiné une fois et retourné par la CSS selon l'état :
         il pointe vers le haut quand la feuille est à monter, vers le bas quand
         elle est à redescendre. Il remplace la barre à saisir d'avant, qui
         annonçait le même geste sans dire dans quel sens. -->
    <svg class="panneau__poignee-chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
      <path d="M3.5 10 8 5.5 12.5 10"/>
    </svg>
    <!-- Le mot ne bouge plus d'une vue à l'autre ; c'est l'`aria-label`, posé
         par `majPoignee`, qui dit s'il ouvre la journée ou le parcours. -->
    <span class="panneau__poignee-texte" id="poignee-texte">+ d'infos</span>
  </button>

  <aside class="panneau" id="panneau" tabindex="-1" aria-live="polite"></aside>

  <!-- La barre « précédent / suivant » vit dans la scène, hors du panneau :
       sur téléphone elle borde la carte quand la feuille est fermée, et le
       récit quand elle est ouverte. Au pied de la fiche, elle disparaissait
       avec le détail — il fallait rouvrir la journée pour passer à la
       suivante, alors que c'est le geste qu'on fait le plus. -->
  <nav class="navigation" id="navigation" aria-label="Journée précédente et suivante"></nav>
</main>

<script src="js/vendor/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
