name: Publier un aperçu

# Publie DEUX versions du site d'un coup : `main` à la racine, exactement comme
# d'habitude, et une branche d'essai dans `/essai/`. Le site en ligne ne change
# donc pas — on ouvre la version corrigée sur son téléphone, à la même adresse
# suivie de `/essai/`, sans que personne d'autre ne s'en aperçoive.
#
# Tout tient parce que le site n'a que des chemins relatifs : servi depuis un
# sous-dossier, il y trouve ses données, ses photos et sa feuille de style sans
# rien savoir de l'endroit où il est posé. Le carnet de route fonctionne aussi —
# le service autorise l'ORIGINE `tinmarlastar.github.io`, pas un chemin
# particulier.
#
# À lancer à la main depuis l'onglet Actions, en choisissant la branche d'essai.
# La publication ordinaire sur `main` (pages.yml) efface l'aperçu au passage :
# c'est voulu, un essai n'a pas à survivre à la mise en ligne suivante.

on:
  workflow_dispatch:
    inputs:
      branche:
        description: "Branche à publier dans /essai/"
        required: true
        default: claude/site-mobile-ux-audit-ochnz6

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Le site en ligne, à la racine
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: La branche d'essai, dans /essai/
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branche }}
          path: site/essai

      # Chaque copie porte son propre `.git` : l'envoyer publierait l'historique
      # complet du dépôt, deux fois, pour rien.
      - name: Retirer les deux dossiers .git
        run: rm -rf site/.git site/essai/.git

      - name: Rappeler où trouver l'essai
        run: |
          echo "### Aperçu publié" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Le site habituel, inchangé, à la racine." >> "$GITHUB_STEP_SUMMARY"
          echo "- La branche \`${{ inputs.branche }}\` sous **/essai/**." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
