<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aventure des 4 Nations — Salta → Cusco à moto</title>
<meta name="description" content="Le parcours jour par jour du raid moto Salta–Cusco : 3 036 km, 875 km de piste, quatre pays andins, du désert d'Atacama au Machu Picchu.">
<meta name="theme-color" content="#101B31">

<meta property="og:type" content="website">
<meta property="og:title" content="Aventure des 4 Nations — Salta → Cusco à moto">
<meta property="og:description" content="3 036 km, 875 km de piste, quatre pays andins. Le parcours jour par jour.">
<meta property="og:image" content="img/etapes/hero-salar.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/vendor/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<a class="saut-contenu" href="#panneau">Aller au détail de l'étape</a>

<header class="bandeau">
  <div class="bandeau__identite">
    <p class="eyebrow" id="eyebrow-voyage"></p>
    <h1 class="bandeau__titre" id="titre-voyage"></h1>
  </div>

  <!-- La navigation passe à droite du titre : elle commande, elle ne nomme
       pas. À gauche, elle précédait le nom du voyage à chaque écran. -->
  <div class="bandeau__navigation">
    <button type="button" class="bouton-accueil" id="bouton-accueil" hidden>
      <span aria-hidden="true">←</span> Tout le parcours
    </button>

    <div class="pas-a-pas" role="group" aria-label="Naviguer d'étape en étape">
      <button type="button" id="etape-precedente" aria-label="Étape précédente">←</button>
      <span class="pas-a-pas__position" id="etape-position" aria-live="polite">—</span>
      <button type="button" id="etape-suivante" aria-label="Étape suivante">→</button>
    </div>
  </div>

</header>

<!-- La frise est la barre de navigation du site : le profil d'altitude, les
     quinze journées et le nombre de souvenirs de chacune, d'un seul tenant.
     Posée au-dessus de la carte, là où on la cherche. -->
<nav class="frise" aria-label="Choisir une journée">
  <div class="frise__defilement">
    <svg class="frise__svg" id="frise" role="img"
         aria-label="Profil d'altitude du voyage entier, du jour 1 au jour 15. Cliquez une étape pour la détailler."></svg>
  </div>
</nav>

<main class="scene">
  <div id="carte" class="carte" role="application" aria-label="Carte du parcours"></div>

  <!-- Le choix du fond commande la carte : il vit donc sur la carte, et reste
       à portée sur toutes les vues. Dans le panneau, il aurait disparu dès
       qu'une étape est ouverte. -->
  <div class="fonds" role="group" aria-label="Fond de carte">
    <button type="button" class="fonds__bouton" data-fond="satellite" aria-pressed="true">Satellite</button>
    <button type="button" class="fonds__bouton" data-fond="relief" aria-pressed="false">Relief</button>
    <button type="button" class="fonds__bouton" data-fond="plan" aria-pressed="false">Plan</button>
  </div>

  <button type="button" class="panneau__poignee" id="poignee" aria-expanded="false" aria-controls="panneau">
    <span class="panneau__poignee-barre" aria-hidden="true"></span>
    <span id="poignee-texte">Voir le détail</span>
  </button>

  <aside class="panneau" id="panneau" tabindex="-1" aria-live="polite"></aside>
</main>

<script src="js/vendor/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
